<div class="description-menu-container">
  <div class="menu-date">
    <h4>{{ menu()?.date| date : "EEEE, dd/MM/yyyy" }}</h4>
  </div>

  @for(dish of menu()?.dishes; track $index){
  <div class="dish">
    <h2 class="dish-name">{{ dish.name }}</h2>
    <p>{{ dish.description }}</p>
  </div>
  }
</div>
